services:
  influxdb:
    image: influxdb:3-core@sha256:43991052bc05fd1ee494998de89a55699587c8c0a6591dd33f30c7246752c7f8
    command: ["influxdb3", "serve", "--node-id=k6", "--object-store=file", "--data-dir=/var/lib/influxdb3/data"]
    ports:
      - "127.0.0.1:8181:8181"
    volumes:
      - influxdb3-data:/var/lib/influxdb3/data

  k6:
    build: .
    profiles: ["tools"]
    environment:
      K6_OUT: xk6-influxdb=http://influxdb:8181
      K6_INFLUXDB_DATABASE: k6
      K6_INFLUXDB_TOKEN: ${K6_INFLUXDB_TOKEN:-}
    volumes:
      - ./samples:/scripts:ro

volumes:
  influxdb3-data:
